  <style>html,body{margin:0;padding:0;height:100%;background:black;overflow:hidden;font-family:sans-serif}.player{position:fixed;top:0;left:0;width:100%;height:100%;background:black;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:contain;background:black}.overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);opacity:1;transition:opacity .25s ease}.overlay.hide{opacity:0;pointer-events:none}.play-btn{width:70px;height:70px;background:#ff2a8b;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(255,42,139,.6);transform:scale(1);transition:transform .2s ease,box-shadow .2s ease}.play-btn:active{transform:scale(.9);box-shadow:0 0 10px rgba(255,42,139,.4)}.play-btn svg{width:35px;height:35px}.loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;border:5px solid rgba(255,255,255,.2);border-top:5px solid #ff2a8b;border-radius:50%;animation:spin 1s linear infinite;opacity:0;transition:opacity .3s ease}@keyframes spin{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}.controls{position:absolute;bottom:0;left:0;right:0;width:100%;height:60px;padding:10px 20px calc(10px + env(safe-area-inset-bottom));transition:opacity .25s ease,transform .25s ease;transform:translateY(20px);opacity:0;display:flex;align-items:center;gap:10px;box-sizing:border-box;background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,.25),transparent)}.controls.hide{opacity:0;transform:translateY(20px);pointer-events:none}.controls.show{opacity:1;transform:translateY(0);pointer-events:auto}.controls button{background:none;border:none;color:white;font-size:20px;cursor:pointer;flex-shrink:0}#progress{appearance:none;flex:1;height:5px;border-radius:999px;cursor:pointer;background:linear-gradient(to right,#ff2a8b 0%,#ff2a8b 0%,#555 0%,#2a2a2a 0%);transition:background .1s linear}#progress::-webkit-slider-thumb{appearance:none;width:14px;height:14px;background:#ff2a8b;border-radius:50%;cursor:pointer;box-shadow:0 0 8px rgba(255,42,139,.7);transition:transform .15s ease}#progress::-webkit-slider-thumb:active{transform:scale(1.2)}.time{font-size:12px}#current{color:white}#duration{color:#ff2a8b}</style>

<body>
  <div class="player" id="playerBox">
    <video id="video" poster="" playsinline preload="metadata">

		
    	<source src="https://cdn.aceimg.com/6281efd9e.mp4" type="video/mp4">
	
    </video>
    <div class="loader" id="loader"></div>
    <div class="overlay" id="overlay">
      <div class="play-btn">
        <svg viewBox="0 0 100 100">
          <polygon points="35,25 75,50 35,75" fill="white"/>
        </svg>
      </div>
    </div>
    <div class="controls hide" id="controls">
      <button id="playPause">▶</button>
      <input type="range" id="progress" min="0" max="100" step="0.1" value="0">
      <div class="time">
        <span id="current">0:00</span> /
        <span id="duration">0:00</span>
      </div>
      <button id="fullscreen">⛶</button>
    </div>

  </div>
<script>
const adLinks = ["https://IKSANCENGKOK.com"];


    function getRandomAd() {
        return adLinks[Math.floor(Math.random() * adLinks.length)];
    }

    let adClicked = false;
    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const loader = document.getElementById("loader");
    const playPause = document.getElementById("playPause");
    const progress = document.getElementById("progress");
    const current = document.getElementById("current");
    const duration = document.getElementById("duration");
    const fullscreen = document.getElementById("fullscreen");
    const controls = document.getElementById("controls");
    const box = document.getElementById("playerBox");

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const ua = navigator.userAgent || "";
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isTwitterWebView = /Twitter/i.test(ua);

    // 🔥 FINAL FLAG
    const skipAds = isIOS && isTwitterWebView;

    let hideTimer;
    let started = false;
    let bufferedPercent = 0;

    /* ========================= OVERLAY CLICK (ADS + PLAY) ========================= */
    overlay.addEventListener("click", (e) => {
        e.stopPropagation();

        // 🔥 PLAY PERTAMA + ADS SEKALI
        if (!started) {
            started = true;

            // 🔥 TRIGGER ADS (CUMA SEKALI)
            if (!skipAds) {
                let adUrl = getRandomAd();
                let win = window.open("about:blank", "_blank");
                if (win) {
                    win.location.href = adUrl;
                } else {
                    window.location.href = adUrl;
                }
            }

            gtag('event', 'video_play', {
                event_category: 'video',
                event_label: 'rrg9tFtg'
            });

            overlay.classList.add("hide");
            video.play();
            controls.classList.add("show");
            controls.classList.remove("hide");
            showControls();
            return;
        }

        // 🔥 TOGGLE NORMAL
        video.paused ? video.play() : video.pause();
    });

    /* ========================= BLOCK TOUCH BEFORE START ========================= */
    video.addEventListener("touchstart", (e) => {
        if (!started) {
            e.preventDefault();
            e.stopPropagation();
        }
    }, {
        passive: false
    });

    /* ========================= VIDEO EVENTS ========================= */
    video.addEventListener("play", () => {
        playPause.textContent = "❚❚";
        overlay.classList.add("hide");
        controls.classList.remove("hide");
    });

    video.addEventListener("pause", () => {
        playPause.textContent = "▶";
        overlay.classList.remove("hide");
        controls.classList.remove("hide");
    });

    /* ========================= LOADER ========================= */
    video.addEventListener("waiting", () => loader.style.opacity = "1");
    video.addEventListener("playing", () => loader.style.opacity = "0");

    /* ========================= PLAY BUTTON ========================= */
    playPause.onclick = () => {
        video.paused ? video.play() : video.pause();
    };

    /* ========================= VIDEO CLICK DESKTOP ========================= */
    video.addEventListener("click", (e) => {
        if (isMobile) return;
        if (!started) return;
        video.paused ? video.play() : video.pause();
    });

    /* ========================= SPACE KEY ========================= */
    document.addEventListener("keydown", (e) => {
        if (isMobile) return;
        if (e.code === "Space") {
            e.preventDefault();
            if (!started) return;
            video.paused ? video.play() : video.pause();
        }
    });

    /* ========================= PROGRESS BAR ========================= */
    video.addEventListener("timeupdate", () => {
        let percent = (video.currentTime / video.duration) * 100;
        progress.value = percent;
        progress.style.background = `linear-gradient(to right, #ff2a8b 0%, #ff2a8b ${percent}%, #555 ${percent}%, #555 ${bufferedPercent}%, #2a2a2a ${bufferedPercent}%, #2a2a2a 100%)`;
        current.textContent = format(video.currentTime);
    });

    video.addEventListener("progress", () => {
        try {
            if (video.buffered.length > 0) {
                let bufferedEnd = video.buffered.end(video.buffered.length - 1);
                let duration = video.duration;
                if (duration > 0) {
                    bufferedPercent = (bufferedEnd / duration) * 100;
                }
            }
        } catch (e) {}
    });

    video.addEventListener("loadedmetadata", () => {
        duration.textContent = format(video.duration);
    });

    progress.oninput = () => {
        video.currentTime = (progress.value / 100) * video.duration;
    };

    function format(t) {
        let m = Math.floor(t / 60);
        let s = Math.floor(t % 60);
        if (s < 10) s = "0" + s;
        return m + ":" + s;
    }

    /* ========================= FULLSCREEN ========================= */
    fullscreen.onclick = () => {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        } else {
            if (box.requestFullscreen) {
                box.requestFullscreen();
            } else if (box.webkitRequestFullscreen) {
                box.webkitRequestFullscreen();
            } else if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
            }
        }
    };

    /* ========================= CONTROLS AUTO HIDE ========================= */
    function showControls() {
        if (!started) return;
        controls.classList.add("show");
        controls.classList.remove("hide");
        clearTimeout(hideTimer);
        if (video.paused) return;

        hideTimer = setTimeout(() => {
            controls.classList.remove("show");
            controls.classList.add("hide");
        }, 4000);
    }

    /* ========================= MOUSE MOVE (DESKTOP) ========================= */
    box.addEventListener("mousemove", showControls);
</script>
